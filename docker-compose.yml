    build:
      context: .
      dockerfile: Dockerfile
    container_name: semantic_dfl_node_0
    hostname: node-0
    networks:
      semantic_dfl_net:
        ipv4_address: 172.28.0.10
    ports:
    - 50050:50050
    environment:
      PYTHONUNBUFFERED: '1'
      NODE_ID: '0'
      NODE_PORT: '50050'
    volumes:
    - ./results:/app/results
    - ./Datasets:/app/Datasets
    - ./logs:/app/logs
    command: --node_id 0 --host 0.0.0.0 --port 50050 --is_super_peer --rounds 10 --config
      configs/default_config.yaml
    restart: unless-stopped
