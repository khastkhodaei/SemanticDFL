# =====================================================================
# SemanticDFL Configuration Profile: Real-World EU SLICES Multi-Node Deployment
# Production deployment across 100 distributed edge nodes / bare-metal servers.
# =====================================================================

execution:
  mode: "slices_distributed" # options: "simulation" | "distributed" | "slices_distributed"
  backend: "grpc"
  distributed:
    host: "0.0.0.0"
    base_port: 50050
    spawn_subprocesses: false

slices:
  num_nodes: 100
  super_peers:
    - "node-eu-central-01:50050"
    - "node-eu-west-01:50050"
  peer_discovery: "gossip"
  network_interface: "eth0"
  container_network: "slices_overlay_net"

simulation:
  rounds: 50
  seed: 42
  device: "auto"

federated:
  num_clients: 100
  k_neighbors: 10
  zone_size: 5
  rounds: 50
  alpha_personalization: 0.67

data:
  dataset: "fmnist"
  partitioner: "dirichlet"
  alpha: 0.3
  batch_size: 32
  data_dir: "./Datasets"

model:
  architecture: "FashionCNN"
  local_epochs: 1
  learning_rate: 0.01

transport:
  backend: "grpc"
  max_workers: 16
  timeout_seconds: 20.0
  keepalive_time_ms: 10000

logging:
  save_results_json: true
  detailed_client_metrics: true
  generate_plots: true
  output_dir: "results/slices_production"
