execution:
  mode: "simulation" # options: "simulation" | "distributed"
  backend: "grpc"
  distributed:
    host: "127.0.0.1"
    base_port: 50050
    spawn_subprocesses: true

simulation:
  rounds: 50
  seed: 42
  device: "auto"

seeds:
  topology_seed: 42
  data_seed: 42
  vrf_seed: 42
  model_seed: 42

federated:
  num_clients: 100
  k_neighbors: 10
  zone_size: 5
  alpha_personalization: 0.67

network:
  topology: "small_world" # options: "ring" | "small_world" | "geometric" | "grid" | "slices_wan"
  degree: 6
  p_rewire: 0.15
  dynamic_topology: false

data:
  dataset: "fmnist"
  partitioner: "dirichlet"
  alpha: 0.3
  batch_size: 32

model:
  architecture: "FashionCNN"
  local_epochs: 1
  learning_rate: 0.01

logging:
  save_results_json: true
  detailed_client_metrics: true
  generate_plots: true
  output_dir: "results"
