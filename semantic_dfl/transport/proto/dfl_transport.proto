syntax = "proto3";

package semantic_dfl.transport;

option py_generic_services = false;

// ----------------------------------------------------------------------------
// Core Data Structures
// ----------------------------------------------------------------------------

enum PeerRole {
  ROLE_PEER = 0;
  ROLE_SUPER_PEER = 1;
  ROLE_BOOTSTRAP = 2;
  ROLE_ZONE_INITIATOR = 3;
}

message PeerInfo {
  int32 node_id = 1;
  string hostname = 2;
  int32 port = 3;
  PeerRole role = 4;
  string zone_id = 5;
  int32 level = 6;
  bool is_super_peer = 7;
  double timestamp = 8;
  repeated int32 replica_super_peers = 9;
}

message TensorProto {
  bytes tensor_bytes = 1;
  string dtype = 2;              // e.g. "float32", "float64", "int64"
  repeated int64 shape = 3;      // tensor dimensions
  bool is_sparse = 4;
  bytes sparse_indices = 5;      // optional indices for sparse format
  int64 num_elements = 6;
  string compression = 7;        // "none", "gzip", "lz4"
}

// ----------------------------------------------------------------------------
// Peer Discovery & Heartbeat Messages
// ----------------------------------------------------------------------------

message PeerRegistrationRequest {
  PeerInfo peer = 1;
  string cluster_id = 2;
  int32 target_p = 3;
}

message PeerRegistrationResponse {
  bool success = 1;
  string message = 2;
  int32 assigned_node_id = 3;
  repeated PeerInfo active_peers = 4;
  string network_id = 5;
}

message HeartbeatRequest {
  int32 node_id = 1;
  double timestamp = 2;
  int32 current_round = 3;
  float current_loss = 4;
}

message HeartbeatResponse {
  bool acknowledged = 1;
  double server_timestamp = 2;
  bool trigger_topology_refresh = 3;
}

message PeerDiscoveryRequest {
  int32 query_node_id = 1;
  string zone_id = 2;
  int32 radius_ttl = 3;
  int32 level = 4;
}

message PeerDiscoveryResponse {
  repeated PeerInfo peers = 1;
  int32 total_count = 2;
}

// ----------------------------------------------------------------------------
// Signature Exchange Messages
// ----------------------------------------------------------------------------

message SignaturePayload {
  int32 node_id = 1;
  int32 round_num = 2;
  TensorProto signature = 3;
  int32 cardinality_p = 4;
  double timestamp = 5;
  string zone_id = 6;
}

message SignatureAck {
  bool received = 1;
  int32 node_id = 2;
  int32 round_num = 3;
  string message = 4;
}

message SignatureQuery {
  int32 target_node_id = 1;
  int32 requester_node_id = 2;
  int32 round_num = 3;
}

// ----------------------------------------------------------------------------
// Model Pull & Parameter Streaming Messages
// ----------------------------------------------------------------------------

message ModelPullRequest {
  int32 requester_node_id = 1;
  int32 target_node_id = 2;
  int32 round_num = 3;
  float similarity_score = 4;
  bool stream_chunks = 5;
}

message ModelChunkPayload {
  int32 node_id = 1;
  int32 round_num = 2;
  int32 chunk_index = 3;
  int32 total_chunks = 4;
  TensorProto parameters = 5;
  bool is_last_chunk = 6;
  string checksum = 7;
}

// ----------------------------------------------------------------------------
// Overlay Topology Broadcast Messages
// ----------------------------------------------------------------------------

message TopologyNotification {
  int32 initiator_id = 1;
  int32 level = 2;
  string zone_id = 3;
  repeated int32 member_ids = 4;
  int32 super_peer_id = 5;
  repeated int32 replica_super_peers = 6;
  TensorProto prototype_signature = 7;
  double timestamp = 8;
}

message TopologyAck {
  bool success = 1;
  int32 node_id = 2;
  string message = 3;
}

// ----------------------------------------------------------------------------
// gRPC Transport Service
// ----------------------------------------------------------------------------

service SemanticDFLTransport {
  // Discovery & Registration
  rpc RegisterPeer(PeerRegistrationRequest) returns (PeerRegistrationResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc DiscoverPeers(PeerDiscoveryRequest) returns (PeerDiscoveryResponse);

  // Top-P Signature Exchange
  rpc ExchangeSignature(SignaturePayload) returns (SignatureAck);
  rpc FetchSignature(SignatureQuery) returns (SignaturePayload);

  // Personalized Pull Parameter Aggregation
  rpc PullModelWeights(ModelPullRequest) returns (ModelChunkPayload);
  rpc StreamModelWeights(ModelPullRequest) returns (stream ModelChunkPayload);

  // Topology & Super-Peer Failover Broadcasts
  rpc BroadcastTopology(TopologyNotification) returns (TopologyAck);
}
